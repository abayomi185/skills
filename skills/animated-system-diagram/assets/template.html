<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@600;700&display=swap">
<style>
/* Animated system diagram. One deliberate light look (white canvas), so colours do not follow dark mode. */
:root {
  color-scheme: light;
  --bg: #ffffff; --panel: #f7f8fb; --ink: #111827; --text: #374151; --muted: #6b7280; --line: #e5e7eb; --wire: #c3cad6;
  --violet: #ece8ff; --violet-s: #7c6ad8;  --blue: #e2efff; --blue-s: #3b7ddd;
  --green: #e1f5e9; --green-s: #2f9e63;   --orange: #ffeedd; --orange-s: #e6862e;
  --pink: #fde7f1; --pink-s: #d14d8a;     --teal: #dff5f4; --teal-s: #1f9a93;
  --slate: #eef1f5; --slate-s: #64748b;   --yellow: #fff6d6; --yellow-s: #d29b00;
  --good: #16a34a; --good-bg: #e8f7ee; --warn: #d97706; --warn-bg: #fff4e0; --bad: #dc2626; --bad-bg: #fdecec;
  --head: "Poppins", "Segoe UI", system-ui, sans-serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); margin: 0; }
.page { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--head); color: var(--ink); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.1; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
code { font-family: var(--mono); font-size: 0.84em; }
:focus-visible { outline: 2px solid var(--blue-s); outline-offset: 2px; }
.hero { display: grid; gap: 12px; }
.hero p { max-width: 70ch; font-size: 1.05rem; }
.eyebrow { font: 600 0.74rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-s); }
.scen { display: flex; flex-wrap: wrap; gap: 8px; }
.scen button { font: 500 0.88rem/1.2 var(--sans); color: var(--text); background: var(--bg); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.scen button b { font: 600 0.7rem/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--violet-s); }
.scen button:hover { border-color: var(--wire); }
.scen button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--panel); }
.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; padding: 14px 16px; background: var(--panel); border-radius: 14px; }
.bar .q { display: grid; gap: 2px; min-width: 0; flex: 1 1 360px; }
.bar .q p { color: var(--muted); font-size: 0.9rem; }
.ctrls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctrls button { font: 600 0.86rem/1 var(--sans); border-radius: 10px; padding: 10px 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.ctrls button.primary { background: var(--ink); color: #fff; border-color: var(--ink); min-width: 96px; justify-content: center; }
.ctrls button:hover { border-color: var(--ink); }
.ctrls svg { width: 14px; height: 14px; fill: currentColor; }
.prog { font: 500 0.8rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.lanes { display: grid; grid-template-columns: repeat(var(--lanes, 2), minmax(0, 1fr)); gap: 20px; }
@media (max-width: 1000px) { .lanes { grid-template-columns: 1fr; } }
.lane { border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.lane-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.lane-h .t { display: grid; gap: 2px; }
.lane-h .t span { font: 600 0.72rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; background: var(--panel); border-radius: 10px; padding: 3px; }
.seg button { font: 600 0.8rem/1 var(--sans); border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(17,24,39,.12); }
.counters { display: flex; gap: 8px; flex-wrap: wrap; }
.ctr { display: inline-flex; align-items: baseline; gap: 6px; background: var(--panel); border-radius: 10px; padding: 6px 10px; font-size: 0.78rem; color: var(--muted); }
.ctr b { font: 700 1.1rem/1 var(--head); color: var(--ink); font-variant-numeric: tabular-nums; }
.ctr.f b { color: var(--yellow-s); }
.start { font: 500 0.76rem/1.4 var(--mono); color: var(--muted); background: var(--panel); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
svg.dia { width: 100%; height: auto; display: block; overflow: visible; }
.box rect.body { stroke-width: 1.6; }
.box text.ti { font: 600 14px var(--head); fill: var(--ink); }
.box text.su { font: 500 10px var(--mono); fill: var(--muted); }
.box.hit rect.body { stroke-width: 2.6; }
@media (prefers-reduced-motion: no-preference) { .box.hit rect.body { animation: pulse .45s ease-out; } @keyframes pulse { 50% { stroke-width: 4; } } }
.edge { stroke: var(--wire); stroke-width: 1.4; fill: none; }
.edge.on { stroke: var(--ink); stroke-width: 2; }
.pk rect.pill { filter: drop-shadow(0 2px 3px rgba(17,24,39,.18)); }
.pk text { font: 600 10.5px var(--mono); }
.pk .num { font: 700 10px var(--sans); fill: var(--ink); }
.fbadge text.l { font: 600 10px var(--mono); letter-spacing: .05em; fill: var(--muted); }
.fbadge text.v { font: 600 11px var(--sans); fill: var(--ink); }
.fbadge.on rect { fill: var(--yellow); stroke: var(--yellow-s); }
.fbadge.on text.l { fill: var(--yellow-s); }
.note text { font: 500 10.5px var(--sans); fill: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .note, .fbadge rect { transition: opacity .25s, fill .2s, stroke .2s; } }
.out { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; min-height: 76px; }
.out .big { font: 700 1.05rem/1.2 var(--head); white-space: nowrap; padding: 6px 12px; border-radius: 999px; color: #fff; }
.out p { font-size: 0.88rem; color: var(--text); }
.out.good { background: var(--good-bg); } .out.good .big { background: var(--good); }
.out.warn { background: var(--warn-bg); } .out.warn .big { background: var(--warn); }
.out.bad { background: var(--bad-bg); } .out.bad .big { background: var(--bad); }
.out.wait { background: var(--panel); color: var(--muted); align-items: center; }
.out.wait .big { background: var(--wire); }
@media (max-width: 520px) { .out { flex-direction: column; } }
.trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.8rem; }
.trail li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline; transition: opacity .2s; }
.trail li.todo { opacity: .32; }
.trail li.cur { font-weight: 600; }
.trail .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 0.68rem/1 var(--sans); background: var(--ink); color: #fff; }
.trail .n.f { background: var(--yellow-s); }
.trail .n.o { background: var(--wire); }
.trail code { color: var(--ink); overflow-wrap: anywhere; }
.trail .r { color: var(--muted); }
.card { border: 1.5px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 600 0.72rem/1.2 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
td .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
td small { display: block; color: var(--muted); font-size: 0.76rem; font-variant-numeric: tabular-nums; }
.mk { font: 700 0.95rem/1 var(--head); }
.mk.y { color: var(--good); } .mk.n { color: var(--bad); } .mk.p { color: var(--warn); }
.two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
.two.one { grid-template-columns: 1fr; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.closing { display: grid; gap: 10px; max-width: 72ch; }
/* interaction: scenario inputs, inspect panel */
.inputs { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.inp { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--ink); font-weight: 500; }
.inp select { font: 500 0.86rem/1.2 var(--sans); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%; }
.inp .segi { display: inline-flex; flex-wrap: wrap; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.inp .segi button { font: 600 0.8rem/1 var(--mono); border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.inp .segi button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.inp.tog input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--wire); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.inp.tog input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.inp.tog input:checked { background: var(--ink); }
.inp.tog input:checked::after { left: 18px; }
.box.can { cursor: pointer; }
.box.can:focus { outline: none; }
.box.can:focus-visible rect.body, .box.sel rect.body { stroke: var(--ink); stroke-width: 2.6; }
.box .ib { font: 700 9px var(--sans); fill: var(--muted); }
.pk { cursor: pointer; }
.trail button { all: unset; display: contents; cursor: pointer; }
.trail li:has(button:focus-visible) { outline: 2px solid var(--blue-s); outline-offset: 2px; border-radius: 6px; }
.trail li.sel code { text-decoration: underline; text-underline-offset: 3px; }
.insp { border: 1.5px solid var(--ink); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; font-size: 0.82rem; min-width: 0; }
.insp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.insp-h b { font: 600 0.92rem var(--head); color: var(--ink); }
.insp-h span { font: 500 0.72rem var(--mono); color: var(--muted); }
.insp button.x { font: 600 0.78rem var(--sans); border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.insp h4 { margin: 4px 0 0; font: 600 0.7rem/1.2 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.insp pre { margin: 0; font: 0.76rem/1.5 var(--mono); background: var(--panel); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.insp table { font-size: 0.78rem; }
.insp th, .insp td { padding: 4px 8px; font-family: var(--mono); }
.insp tr.chg td { background: var(--yellow); }
footer { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header class="hero"><span class="eyebrow" id="eyebrow"></span><h1 id="h1"></h1><p id="lede"></p></header>
  <nav class="scen" id="scen" aria-label="Scenario"></nav>
  <div class="bar">
    <div class="q"><h2 id="q-title"></h2><p id="q-desc"></p></div>
    <div class="ctrls">
      <button type="button" id="b-replay"><svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.6 3.9l1.8.7A4 4 0 1 0 8 4v2.5L4.5 3.2 8 0z"/></svg>Replay</button>
      <button type="button" id="b-play" class="primary"></button>
      <button type="button" id="b-step">Step<svg viewBox="0 0 16 16"><path d="M3 2l7 6-7 6zM11 2h2v12h-2z"/></svg></button>
      <span class="prog" id="prog"></span>
    </div>
    <div class="inputs" id="inputs" hidden></div>
  </div>
  <div class="lanes" id="lanes"></div>
  <section class="card" id="summary" aria-labelledby="sum-h">
    <h2 id="sum-h">Side by side</h2>
    <div class="two" id="sum-two"><div class="tw"><table id="sum-tasks"></table></div><div class="tw"><table id="sum-g"></table></div></div>
    <div class="closing" id="closing"></div>
  </section>
  <footer id="footer"></footer>
</div>

<script>
/* Step helpers, used by the data block below. */
const req = (label, full, res, o = {}) => ({ k: "req", label, full, res, ...o });
const filter = (t, o = {}) => ({ k: "filter", t, ...o });
const note = (at, t) => ({ k: "note", at, t });
</script>

<script>
/* DIAGRAM-DATA:START  (replace everything between START and END; see SKILL.md for the format) */
const DIAGRAM = {
  title: "Example",
  eyebrow: "Example",
  heading: "Replace this data block",
  lede: "One scenario, two lanes.",
  components: {
    client: { title: "Client", sub: "browser", icon: "person", color: "violet", box: [8, 112, 124, 84] },
    api: { title: "API", sub: "/v1", icon: "api", color: "blue", box: [236, 112, 124, 84] },
    db: { title: "Database", sub: "users", icon: "db", color: "green", box: [456, 108, 136, 92] },
  },
  filterAt: "client",
  lanes: [{ variants: ["a"] }, { variants: ["b"] }],
  variants: { a: { kicker: "Today", title: "Design A" }, b: { kicker: "Proposal", title: "Design B" } },
  scenarios: [{
    id: "s1", tag: "User", title: "Load a profile", desc: "Fetch one user.",
    runs: {
      a: { steps: [req("GET /users", "GET /v1/users", "100 users", { via: [["db", "find all", "100 rows"]] }), filter("id → 1 of 100", { tone: "warn" })], out: ["warn", "Slow", "Lists everything, filters locally."] },
      b: { steps: [req("GET /users/42", "GET /v1/users/42", "1 user", { via: [["db", "findOne", "1 row"]], tone: "good" })], out: ["good", "Direct", "One lookup."] },
    },
  }],
  summary: { columns: ["a", "b"] },
  footer: "",
};
/* DIAGRAM-DATA:END */
</script>

<script>
(() => {
"use strict";
const D = DIAGRAM;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const HOP_MS = D.hopMs || 950, MOVE_MS = Math.round((D.hopMs || 950) * 0.76), VW = 600, VH = D.height || 300;
const CIDS = Object.keys(D.components);
const CLIENT = D.client || CIDS[0], SERVER = D.server || CIDS[1];

const ICON = {
  bot: '<rect x="0" y="3" width="18" height="13" rx="3" fill="none" stroke-width="1.6"/><circle cx="6" cy="9.5" r="1.6"/><circle cx="12" cy="9.5" r="1.6"/><path d="M9 0v3" stroke-width="1.6"/>',
  person: '<circle cx="9" cy="5" r="4" fill="none" stroke-width="1.6"/><path d="M1 17c0-4.5 3.6-7 8-7s8 2.5 8 7" fill="none" stroke-width="1.6"/>',
  plug: '<path d="M5 0v5M13 0v5M2 5h14v4a7 7 0 0 1-14 0zM9 16v3" fill="none" stroke-width="1.6"/>',
  api: '<path d="M6 2 1 9l5 7M12 2l5 7-5 7" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  db: '<ellipse cx="9" cy="3.5" rx="8" ry="3" fill="none" stroke-width="1.6"/><path d="M1 3.5v11c0 1.7 3.6 3 8 3s8-1.3 8-3v-11M1 9c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke-width="1.6"/>',
  bucket: '<path d="M1 3h16l-2.2 13.5c-.2 1-3 1.5-5.8 1.5s-5.6-.5-5.8-1.5z" fill="none" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="9" cy="3" rx="8" ry="2.2" fill="none" stroke-width="1.6"/>',
  queue: '<rect x="0" y="2" width="18" height="4" rx="1.5" fill="none" stroke-width="1.6"/><rect x="0" y="8" width="18" height="4" rx="1.5" fill="none" stroke-width="1.6"/><rect x="0" y="14" width="18" height="4" rx="1.5" fill="none" stroke-width="1.6"/>',
  server: '<rect x="0" y="1" width="18" height="7" rx="2" fill="none" stroke-width="1.6"/><rect x="0" y="10" width="18" height="7" rx="2" fill="none" stroke-width="1.6"/><circle cx="4" cy="4.5" r="1.2"/><circle cx="4" cy="13.5" r="1.2"/>',
  cache: '<path d="M10 0 2 10h6l-1 8 9-11h-6z" fill="none" stroke-width="1.6" stroke-linejoin="round"/>',
  globe: '<circle cx="9" cy="9" r="8" fill="none" stroke-width="1.6"/><path d="M1 9h16M9 1c3 3 3 13 0 16M9 1c-3 3-3 13 0 16" fill="none" stroke-width="1.4"/>',
  lock: '<rect x="1" y="8" width="16" height="10" rx="2" fill="none" stroke-width="1.6"/><path d="M4.5 8V5a4.5 4.5 0 0 1 9 0v3" fill="none" stroke-width="1.6"/>',
  file: '<path d="M2 0h9l5 5v13H2z M11 0v5h5" fill="none" stroke-width="1.6" stroke-linejoin="round"/>',
};

/* ---------- scenario inputs ---------- */
// A run is either an object or a function of the scenario's input values.
const optsOf = (inp) => (inp.options || []).map((o) => (typeof o === "object" ? o : { value: o, label: String(o) }));
const defaults = (s) => Object.fromEntries((s.inputs || []).map((i) => [i.id, i.default ?? (i.type === "toggle" ? false : optsOf(i)[0].value)]));
const inpVals = {};
const valsOf = (s) => (inpVals[s.id] ||= defaults(s));
const runOf = (s, v, vals) => { const r = s.runs[v]; return typeof r === "function" ? r(vals) : r; };
function* valueSets(s) {
  const d = defaults(s); yield d;
  for (const i of s.inputs || []) for (const o of i.type === "toggle" ? [{ value: !d[i.id] }] : optsOf(i)) yield { ...d, [i.id]: o.value };
}

/* ---------- compile steps to hops ---------- */
function compile(steps) {
  const hops = []; let n = 0;
  steps.forEach((s, si) => {
    s.first = hops.length;
    if (s.k === "req") {
      s.n = ++n;
      const from = s.from || CLIENT, to = s.to || SERVER, x = s.x > 1 ? ` ×${s.x}` : "";
      hops.push({ k: "move", a: from, b: to, t: s.label, n: s.n, si });
      for (const [c, out, back] of s.via || []) {
        hops.push({ k: "move", a: to, b: c, t: out + x, n: s.n, si });
        hops.push({ k: "move", a: c, b: to, t: back || "ok", n: s.n, si });
      }
      hops.push({ k: "move", a: to, b: from, t: s.res, n: s.n, tone: s.tone || (/^4\d\d/.test(s.res) ? "warn" : /^5\d\d/.test(s.res) ? "bad" : ""), si });
    } else hops.push({ ...s, si });
  });
  return hops;
}
// Edges are the union of every component pair any scenario, variant or input value uses, so all lanes share one topology.
const PAIRS = (() => {
  const set = new Set();
  for (const s of D.scenarios) for (const vals of valueSets(s)) for (const v of Object.keys(s.runs)) {
    const r = runOf(s, v, vals); if (!r) continue;
    for (const h of compile(r.steps.map((x) => ({ ...x })))) if (h.k === "move") set.add(`${h.a}|${h.b}`);
  }
  return [...set].map((k) => k.split("|"));
})();

/* ---------- geometry ---------- */
const box = (k) => { const [x, y, w, h] = D.components[k].box; return { x, y, w, h }; };
const ctr = (k) => { const b = box(k); return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; };
function edgePt(k, toward) {
  const c = ctr(k), b = box(k), dx = toward.x - c.x, dy = toward.y - c.y;
  const t = Math.min(dx ? (b.w / 2 + 6) / Math.abs(dx) : Infinity, dy ? (b.h / 2 + 6) / Math.abs(dy) : Infinity);
  return { x: c.x + dx * t, y: c.y + dy * t };
}
function seg(a, b) {
  // The two directions between a pair run on parallel lines, 16px apart.
  const fwd = CIDS.indexOf(a) < CIDS.indexOf(b);
  const [p, q] = fwd ? [a, b] : [b, a];

/* ---------- component state for the inspect panel ---------- */
// State starts from variants[v].data merged with run.data, then each step's `set` applies once the step has started.

}

  const cell = (v) => esc(v == null ? "" : typeof v === "object" ? JSON.stringify(v) : v);
  return `<div class="tw"><table><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>${rows.map((r) => `<tr${r._new ? ' class="chg"' : ""}>${cols.map((c) => `<td>${cell(r[c])}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function valueHtml(v) {

  return Object.entries(v).map(([k, x]) => `<h4>${esc(k)}</h4>${Array.isArray(x) ? tableHtml(x) : typeof x === "string" ? `<p>${esc(x)}</p>` : `<pre>${esc(JSON.stringify(x, null, 2))}</pre>`}`).join("");

const bodyHtml = (b) => (b == null ? "" : `<pre>${esc(typeof b === "string" ? b : JSON.stringify(b, null, 2))}</pre>`);

function renderInsp(lane) {

/* ---------- lanes ---------- */
const state = { scen: 0, t: 0, T: 0, playing: false, timer: null };
const lanes = D.lanes.map((l, i) => ({ key: String.fromCharCode(97 + i), variants: l.variants, variant: l.variants[0], sel: null }));

function buildLane(lane) {

  lane.steps = spec.steps.map((s) => ({ ...s })); lane.hops = compile(lane.steps); lane.out = spec.out;
  lane.dataKeys = new Set([V.data, spec.data, ...lane.steps.map((s) => s.set)].flatMap((o) => Object.keys(o || {})));
  if (lane.sel && (lane.sel.k !== "comp" || !lane.dataKeys.has(lane.sel.id))) lane.sel = null;

function render(lane, animate) {

// Click a component for its state, a trail item or packet for its request and response.
function inspect(e) {

    const MK = { y: "✓", n: "✕", p: "~" };
    $("#sum-g").innerHTML = `<tr><th>${esc(S.guarantees.label || "Guarantee")}</th>${cols.map((c) => `<th>${esc(D.variants[c].short || D.variants[c].kicker)}</th>`).join("")}</tr>` +
      S.guarantees.rows.map(([k, ...c]) => `<tr><td>${esc(k)}</td>${c.map((x) => MK[x] ? `<td class="mk ${x}">${MK[x]}</td>` : `<td><small>${esc(x)}</small></td>`).join("")}</tr>`).join("");
  } else { $("#sum-g").parentElement.remove(); $("#sum-two").classList.add("one"); }
  if (S.closing) $("#closing").innerHTML = S.closing; else $("#closing").remove();
}

load(true);
})();
</script>
</body>
</html>
